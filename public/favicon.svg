<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coffeeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6F4E37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B6914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="steamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1a1a2e" />

  <!-- Coffee cup body -->
  <path d="M28 75 L28 45 Q28 38 33 38 L67 38 Q72 38 72 45 L72 75 Q72 80 67 80 L33 80 Q28 80 28 75 Z" fill="url(#coffeeGradient)" stroke="#4A3728" stroke-width="1.5"/>

  <!-- Coffee liquid -->
  <path d="M32 72 L32 48 Q32 44 36 44 L64 44 Q68 44 68 48 L68 72 Q68 75 64 75 L36 75 Q32 75 32 72 Z" fill="#2C1810" opacity="0.9"/>

  <!-- Cup handle -->
  <path d="M72 48 Q82 48 82 60 Q82 70 72 70" fill="none" stroke="url(#coffeeGradient)" stroke-width="4" stroke-linecap="round"/>

  <!-- Steam lines -->
  <g opacity="0.8">
    <path d="M42 38 Q40 30 42 22 Q44 15 42 10" fill="none" stroke="url(#steamGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M42 38 Q40 30 42 22 Q44 15 42 10; M42 38 Q38 28 42 18 Q46 12 42 8; M42 38 Q40 30 42 22 Q44 15 42 10" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M50 38 Q48 28 50 18 Q52 12 50 8" fill="none" stroke="url(#steamGradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <animate attributeName="d" values="M50 38 Q48 28 50 18 Q52 12 50 8; M50 38 Q50 26 50 16 Q48 10 50 6; M50 38 Q48 28 50 18 Q52 12 50 8" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M58 38 Q60 30 58 22 Q56 15 58 10" fill="none" stroke="url(#steamGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <animate attributeName="d" values="M58 38 Q60 30 58 22 Q56 15 58 10; M58 38 Q62 28 58 18 Q54 12 58 8; M58 38 Q60 30 58 22 Q56 15 58 10" dur="3.2s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- Arabic calligraphy accent (ف) -->
  <text x="50" y="62" text-anchor="middle" font-family="Amiri, serif" font-size="28" font-weight="700" fill="#D4A574" opacity="0.9">ف</text>

  <!-- Small coffee bean decorations -->
  <g fill="#3D2B1F">
    <ellipse cx="20" cy="85" rx="3" ry="2" transform="rotate(-20 20 85)"/>
    <ellipse cx="80" cy="85" rx="3" ry="2" transform="rotate(20 80 85)"/>
  </g>
</svg>